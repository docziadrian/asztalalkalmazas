<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASZAF - Asztali Alkalmazás</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .info p {
            margin: 10px 0;
            color: #555;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🖥️</div>
        <h1>ASZAF</h1>
        <div class="subtitle">Asztali Alkalmazás Fejlesztés</div>
        
        <div class="info">
            <p><strong>Projekt:</strong> Bujáki Erik Attilával közös fejlesztés</p>
            <p><strong>Verzió:</strong> 1.0.0</p>
            <p><strong>Platform:</strong> Electron Desktop Application</p>
        </div>
        
        <div style="margin-top: 30px;">
            <button onclick="showAlert()">Üdvözlés</button>
            <button onclick="showInfo()">Információ</button>
        </div>
    </div>
    
    <script>
        function showAlert() {
            alert('Üdvözöljük az ASZAF alkalmazásban!');
        }
        
        function showInfo() {
            alert('Ez egy közös projekt docziadrian és Bujáki Erik Attila között.');
        }
    </script>
</body>
</html>
